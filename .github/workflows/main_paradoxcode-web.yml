
name: Deploy PARADOXCODE to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Publicar en Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: paradoxcode-web
          package: .
